[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fm-advisor"
version = "0.1.0"
description = "FM26 Tactical & Recruitment Advisor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pydantic>=2.7",
]

[project.optional-dependencies]
ai = ["google-genai>=1.0", "python-dotenv>=1.0"]
api = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
ui = ["streamlit>=1.38"]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/fm_advisor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
